[project]
name = "cnp-fraud-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Derek Ramsey-Aquino", email = "derek.ramseyaquino@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
]

[project.scripts]
cnp-fraud-detection = "cnp_fraud_detection:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "fraud"
