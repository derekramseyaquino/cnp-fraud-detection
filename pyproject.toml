[project]
name = "cnp-fraud-detection"
version = "0.1.0"
description = "Building a card-not-present fraud model."
readme = "README.md"
authors = [
    { name = "Derek Ramsey-Aquino", email = "derek.ramseyaquino@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "fraud"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
